# Unified verification cockpit — PROJECT_NAME
# Generated by verification-cockpit skill. Prefer this over legacy manifest.yaml + tests.yaml.
# Runtime: av → tmux-layout.sh (keep pane commands in sync); at → cockpits.test

project: PROJECT_NAME
risk_profile: medium  # low | medium | high

cockpits:
  verify:
    layout: golden-4
    phi_major: 62
    phi_minor: 38
    panes:
      - id: watch-main
        title: WATCH
        tier: watch
        priority: 1
        space_profile: scroll
        cwd: .
        command: pnpm test --watch
        value: Primary failing signal — replace with project watcher

      - id: console
        title: CMD
        tier: monitor
        priority: 2
        space_profile: interactive
        value: agent_scan, manual verify

      - id: git
        title: GIT
        tier: monitor
        priority: 3
        space_profile: tui-side
        command: lazygit
        tool: lazygit
        value: Review agent diffs

      - id: verify-main
        title: VERIFY
        tier: verify
        priority: 4
        space_profile: confirm-burst
        cwd: .
        command: pnpm test
        value: Full-suite confirm — replace with build/test/lint

  test:
    layout: btop-test
    max_run: 2
    tests:
      - id: npm-test
        priority: 1
        command: pnpm test
        watch_command: pnpm test --watch
        label: package.json test script

      - id: verify-main
        priority: 2
        command: pnpm test
        label: full-suite confirm — replace with build/test/lint

# Add verify panes only when they surface failures (skill value audit).
# Usually omit from verify window: FILES/yazi, SYS/btop
# ab (build window) is host SHELL_AGENT_BUILD_CMD — not configured here.
